name: 'Maven build and test'
description: 'Maven build and test composite action'

inputs:
  maven-target:
    required: true
    description: 'maven target'

  maven-params:
    required: false
    description: 'maven parameters'
    default: ''

  upload-dependencies:
    required: false
    description: 'whether to upload dependencies for analysis'
    default: 'false'

runs:
  using: "composite"

  steps:
  - name: Set up JDK
    uses: actions/setup-java@v5.4.0
    with:
      java-version: '25'
      distribution: 'corretto'
      cache: 'maven'

  - name: Install R
    uses: r-lib/actions/setup-r@v2.12.1                               # 23/06/2026
    with:
      r-version: '4.4.3'

  - name: Install R packages
    uses: r-lib/actions/setup-r-dependencies@v2.12.1                  # 23/06/2026
    with:
      extra-packages: any::geepack

  - name: Install local JAR into Maven repository
    shell: bash
    run: |
      mvn install:install-file \
        -Dfile=lib/gedinline-4.0.1.jar \
        -DgroupId=com.github.nigel-parker \
        -DartifactId=gedinline \
        -Dversion=4.0.1 \
        -Dpackaging=jar
        
  - name: Build and test with Maven
    shell: bash
    run: mvn -B ${{ inputs.maven-target }} ${{ inputs.maven-params }}

  - name: Upload dependencies
    if: inputs.upload-dependencies == 'true'
    uses: advanced-security/maven-dependency-submission-action@v5
